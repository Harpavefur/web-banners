<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Harpa web banner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .banner {
      width: 970px;
      height: 250px;

      position: relative;
      overflow: hidden;

      background: #111;
      color: white;

      cursor: pointer;
    }

    .content {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-direction: column;

      animation: fadeIn 1.2s ease forwards;
    }

    h1 {
      margin: 0;
      font-size: 48px;
      opacity: 0;

      animation: slideUp 0.8s ease forwards;
      animation-delay: 0.3s;
    }

    p {
      margin-top: 12px;
      font-size: 22px;
      opacity: 0;

      animation: slideUp 0.8s ease forwards;
      animation-delay: 0.7s;
    }

    .cta {
      margin-top: 18px;
      padding: 10px 18px;

      border: 1px solid white;

      opacity: 0;

      animation: slideUp 0.8s ease forwards;
      animation-delay: 1.1s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="banner" id="banner">

    <div class="content">

      <h1>Harpa</h1>

      <p>HTML5 vefborði</p>

      <div class="cta">
        Skoða meira
      </div>

    </div>

  </div>

  <script>
    const banner = document.getElementById("banner");

    banner.addEventListener("click", function () {

      window.open(
        "https://www.harpa.is",
        "_blank"
      );

    });
  </script>

</body>
</html>
